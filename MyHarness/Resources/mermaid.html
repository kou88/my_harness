<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=3, user-scalable=yes">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'">
  <script src="mermaid.min.js"></script>
  <script src="mermaid-renderer.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: transparent; overflow: auto; }
    body { width: max-content; min-width: 100%; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #diagram { box-sizing: border-box; padding: 12px; min-width: 100%; }
    #diagram svg { display: block; width: auto !important; height: auto !important; max-width: none !important; }
  </style>
</head>
<body>
  <div id="diagram" role="img" aria-label="Mermaid diagram"></div>
</body>
</html>
