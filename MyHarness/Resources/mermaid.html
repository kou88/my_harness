<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=8, user-scalable=yes">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; font-src 'none'">
  <script src="mermaid.min.js"></script>
  <script src="mermaid-renderer.js"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: transparent; }
    body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body[data-mode="fullscreen"] { overflow: auto; }
    #diagram { box-sizing: border-box; padding: 12px; width: 100%; display: flex; align-items: center; justify-content: center; }
    body[data-mode="fullscreen"] #diagram { min-height: 100%; }
    #diagram svg { display: block; flex: none; max-width: none !important; }
  </style>
</head>
<body>
  <div id="diagram" role="img" aria-label="Mermaid diagram"></div>
</body>
</html>
