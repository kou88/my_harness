name: Article Associated Domains

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect existing Apple settings or apply the approved app ID and profile change
        required: true
        type: choice
        options:
          - inspect
          - apply

permissions:
  contents: read

jobs:
  configure:
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Use existing App Store Connect key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ASC_KEY_P8_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_P8_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Inspect or apply the article capability and app profile
        run: ruby scripts/configure-article-associated-domains.rb
      - name: Remove temporary key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
