name: TestFlight (Stage)

on:
  push:
    branches: [stage]
  pull_request:
    branches: [stage]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-harness-testflight-stage
  cancel-in-progress: true

jobs:
  build_and_upload:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'develop'
      )
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: stage

      - name: Preflight runner arch
        run: |
          set -euo pipefail
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::Runner architecture is not arm64."
            exit 1
          fi
          if sysctl -n sysctl.proc_translated 2>/dev/null | grep -q 1; then
            echo "::error::Runner is running under Rosetta."
            exit 1
          fi

      - name: Verify Xcode
        run: |
          xcodebuild -version

      - name: Decode App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          echo "$ASC_KEY_P8_BASE64" | openssl base64 -d -A > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_P8_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Resolve next TestFlight build number
        env:
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require 'base64'
          require 'json'
          require 'net/http'
          require 'openssl'
          require 'uri'

          key_id = ENV.fetch('ASC_KEY_ID')
          issuer_id = ENV.fetch('ASC_ISSUER_ID')
          key = OpenSSL::PKey::EC.new(File.read(ENV.fetch('ASC_KEY_P8_PATH')))

          base64url = lambda do |value|
            Base64.urlsafe_encode64(value).delete('=')
          end
          header = base64url.call(JSON.generate({ alg: 'ES256', kid: key_id, typ: 'JWT' }))
          payload = base64url.call(JSON.generate({
            iss: issuer_id,
            exp: Time.now.to_i + 20 * 60,
            aud: 'appstoreconnect-v1'
          }))
          signing_input = "#{header}.#{payload}"
          signature_der = key.dsa_sign_asn1(OpenSSL::Digest::SHA256.digest(signing_input))
          signature_asn1 = OpenSSL::ASN1.decode(signature_der)
          raw_signature = signature_asn1.value.map do |integer|
            integer.value.to_i.to_s(16).rjust(64, '0')
          end.join
          token = "#{signing_input}.#{base64url.call([raw_signature].pack('H*'))}"

          get_json = lambda do |uri|
            request = Net::HTTP::Get.new(uri)
            request['Authorization'] = "Bearer #{token}"
            response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
              http.request(request)
            end
            unless response.is_a?(Net::HTTPSuccess)
              warn "App Store Connect request failed: HTTP #{response.code}"
              exit 1
            end
            JSON.parse(response.body)
          end

          apps_uri = URI('https://api.appstoreconnect.apple.com/v1/apps')
          apps_uri.query = URI.encode_www_form(
            'filter[bundleId]' => 'com.kou888.myharness',
            'fields[apps]' => 'bundleId',
            'limit' => '2'
          )
          app = get_json.call(apps_uri).fetch('data').find do |entry|
            entry.dig('attributes', 'bundleId') == 'com.kou888.myharness'
          end
          abort 'App Store Connect app not found for com.kou888.myharness' unless app

          builds_uri = URI('https://api.appstoreconnect.apple.com/v1/builds')
          builds_uri.query = URI.encode_www_form(
            'filter[app]' => app.fetch('id'),
            'fields[builds]' => 'version,uploadedDate',
            'sort' => '-uploadedDate',
            'limit' => '200'
          )
          builds = get_json.call(builds_uri).fetch('data')
          abort 'No existing TestFlight build found' if builds.empty?

          highest_number = builds.map do |build|
            Integer(build.dig('attributes', 'version'), 10)
          end.max
          next_number = highest_number + 1
          File.open(ENV.fetch('GITHUB_ENV'), 'a') do |file|
            file.puts "TESTFLIGHT_BUILD_NUMBER=#{next_number}"
          end
          puts "Next TestFlight build number: #{next_number}"
          RUBY

      - name: Install signing assets
        env:
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          ORIG_DEFAULT_KEYCHAIN="$(security default-keychain 2>/dev/null | tr -d '"' | sed 's/^ *//; s/ *$//' || true)"
          security list-keychains -d user | tr -d '"' | sed 's/^ *//; s/ *$//' > "$RUNNER_TEMP/orig_keychains.txt"
          echo "ORIG_DEFAULT_KEYCHAIN=$ORIG_DEFAULT_KEYCHAIN" >> "$GITHUB_ENV"
          echo "ORIG_KEYCHAINS_FILE=$RUNNER_TEMP/orig_keychains.txt" >> "$GITHUB_ENV"

          KEYCHAIN_PATH="$RUNNER_TEMP/my-harness-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          APP_PROFILE_PATH="$RUNNER_TEMP/app.mobileprovision"
          WIDGET_PROFILE_PATH="$RUNNER_TEMP/widget.mobileprovision"
          USER_HOME="$(dscl . -read /Users/$(whoami) NFSHomeDirectory | awk '{print $2}')"

          echo "$BUILD_CERTIFICATE_BASE64" | openssl base64 -d -A > "$CERT_PATH"

          download_profile() {
            local profile_name="$1"
            local output_path="$2"
            PROFILE_NAME="$profile_name" PROFILE_PATH="$output_path" ruby <<'RUBY'
          require 'base64'
          require 'json'
          require 'net/http'
          require 'openssl'
          require 'time'
          require 'uri'

          key_id = ENV.fetch('ASC_KEY_ID')
          issuer_id = ENV.fetch('ASC_ISSUER_ID')
          key_path = ENV.fetch('ASC_KEY_P8_PATH')
          profile_name = ENV.fetch('PROFILE_NAME')
          profile_path = ENV.fetch('PROFILE_PATH')

          key = OpenSSL::PKey::EC.new(File.read(key_path))

          base64url = lambda do |value|
            Base64.urlsafe_encode64(value).delete('=')
          end

          header = base64url.call(JSON.generate({ alg: 'ES256', kid: key_id, typ: 'JWT' }))
          payload = base64url.call(
            JSON.generate(
              {
                iss: issuer_id,
                exp: Time.now.to_i + 20 * 60,
                aud: 'appstoreconnect-v1'
              }
            )
          )
          signing_input = "#{header}.#{payload}"
          signature_der = key.dsa_sign_asn1(OpenSSL::Digest::SHA256.digest(signing_input))
          signature_asn1 = OpenSSL::ASN1.decode(signature_der)
          raw_signature = signature_asn1.value.map do |integer|
            integer.value.to_i.to_s(16).rjust(64, '0')
          end.join
          token = "#{signing_input}.#{base64url.call([raw_signature].pack('H*'))}"

          uri = URI('https://api.appstoreconnect.apple.com/v1/profiles')
          uri.query = URI.encode_www_form(
            'filter[name]' => profile_name,
            'fields[profiles]' => 'name,profileContent,profileState,profileType,uuid,expirationDate',
            'limit' => '10'
          )

          request = Net::HTTP::Get.new(uri)
          request['Authorization'] = "Bearer #{token}"
          response = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) do |http|
            http.request(request)
          end

          unless response.is_a?(Net::HTTPSuccess)
            warn "Profile fetch failed for #{profile_name}: HTTP #{response.code}"
            exit 1
          end

          body = JSON.parse(response.body)
          profile = body.fetch('data').find do |entry|
            entry.fetch('attributes').fetch('name') == profile_name
          end

          unless profile
            warn "Profile not found: #{profile_name}"
            exit 1
          end

          attributes = profile.fetch('attributes')
          profile_content = attributes.fetch('profileContent')
          File.binwrite(profile_path, Base64.decode64(profile_content))

          puts "Fetched profile: #{attributes.fetch('name')} (#{attributes.fetch('uuid')}, #{attributes.fetch('profileState')})"
          RUBY
          }

          download_profile "my-harness-app-store-push-v2" "$APP_PROFILE_PATH"
          download_profile "my-harness-widget-app-store" "$WIDGET_PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(cat "$RUNNER_TEMP/orig_keychains.txt")
          security default-keychain -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p "$USER_HOME/Library/MobileDevice/Provisioning Profiles"

          extract_profile() {
            local profile_path="$1"
            local prefix="$2"
            local plist_path="$RUNNER_TEMP/${prefix}.plist"
            security cms -D -i "$profile_path" > "$plist_path"
            local uuid
            local name
            local team_id
            local supports_push
            uuid=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$plist_path")
            name=$(/usr/libexec/PlistBuddy -c "Print :Name" "$plist_path")
            team_id=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" "$plist_path")
            if /usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" "$plist_path" >/dev/null 2>&1; then
              supports_push=1
            else
              supports_push=0
            fi
            cp "$profile_path" "$USER_HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
            printf '%s|%s|%s|%s\n' "$uuid" "$name" "$team_id" "$supports_push"
          }

          APP_INFO="$(extract_profile "$APP_PROFILE_PATH" APP)"
          WIDGET_INFO="$(extract_profile "$WIDGET_PROFILE_PATH" WIDGET)"

          IFS='|' read -r APP_PROFILE_UUID APP_PROFILE_NAME APP_TEAM_ID APP_PROFILE_SUPPORTS_PUSH <<< "$APP_INFO"
          IFS='|' read -r WIDGET_PROFILE_UUID WIDGET_PROFILE_NAME WIDGET_TEAM_ID WIDGET_PROFILE_SUPPORTS_PUSH <<< "$WIDGET_INFO"

          {
            echo "APP_PROFILE_UUID=$APP_PROFILE_UUID"
            echo "APP_PROFILE_NAME=$APP_PROFILE_NAME"
            echo "APP_TEAM_ID=$APP_TEAM_ID"
            echo "APP_PROFILE_SUPPORTS_PUSH=$APP_PROFILE_SUPPORTS_PUSH"
            echo "WIDGET_PROFILE_UUID=$WIDGET_PROFILE_UUID"
            echo "WIDGET_PROFILE_NAME=$WIDGET_PROFILE_NAME"
            echo "WIDGET_TEAM_ID=$WIDGET_TEAM_ID"
            echo "TEAM_ID=$APP_TEAM_ID"
          } >> "$GITHUB_ENV"

          if [ "$APP_TEAM_ID" != "$WIDGET_TEAM_ID" ]; then
            echo "::error::App and widget profiles belong to different teams."
            exit 1
          fi

          echo "App profile: $APP_PROFILE_NAME ($APP_PROFILE_UUID)"
          echo "Widget profile: $WIDGET_PROFILE_NAME ($WIDGET_PROFILE_UUID)"
          echo "Team ID: $APP_TEAM_ID"
          security find-identity -v -p codesigning

      - name: Disable push entitlement when profile does not support it
        run: |
          set -euo pipefail
          if [ "${APP_PROFILE_SUPPORTS_PUSH:-0}" = "1" ]; then
            echo "App provisioning profile supports Push Notifications."
            exit 0
          fi

          echo "::warning::App provisioning profile does not include Push Notifications. Stripping aps-environment for this TestFlight archive."
          /usr/libexec/PlistBuddy -c "Delete :aps-environment" MyHarness/MyHarness.entitlements || true
          perl -0pi -e 's/\n\t\t\t\tAPS_ENVIRONMENT = (development|production);//g' MyHarness.xcodeproj/project.pbxproj
          perl -0pi -e 's/\n\t\t\t\t\t\t\t\tcom\.apple\.Push = \{\n\t\t\t\t\t\t\t\t\tenabled = 1;\n\t\t\t\t\t\t\t\t\};//g' MyHarness.xcodeproj/project.pbxproj
          plutil -lint MyHarness/MyHarness.entitlements

      - name: Patch signing settings
        run: |
          set -euo pipefail
          PBXPROJ="MyHarness.xcodeproj/project.pbxproj"

          perl -0pi -e 's/(CA0B1C2D3E4F567801234567 \/\* Debug \*\/ = \{.*?buildSettings = \{.*?DEVELOPMENT_TEAM = )"";/${1}$ENV{APP_TEAM_ID};/s' "$PBXPROJ"
          perl -0pi -e 's/(DA0B1C2D3E4F567801234567 \/\* Release \*\/ = \{.*?buildSettings = \{.*?DEVELOPMENT_TEAM = )"";/${1}$ENV{APP_TEAM_ID};/s' "$PBXPROJ"
          perl -0pi -e 's/(E4F5A6B7C8D9E0F112345678 \/\* Debug \*\/ = \{.*?buildSettings = \{.*?DEVELOPMENT_TEAM = )"";/${1}$ENV{APP_TEAM_ID};/s' "$PBXPROJ"
          perl -0pi -e 's/(F5A6B7C8D9E0F11212345678 \/\* Release \*\/ = \{.*?buildSettings = \{.*?DEVELOPMENT_TEAM = )"";/${1}$ENV{APP_TEAM_ID};/s' "$PBXPROJ"

          perl -pi -e "s/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g" "$PBXPROJ"
          perl -pi -e "s/CODE_SIGN_IDENTITY = \"?Apple Development\"?;/CODE_SIGN_IDENTITY = \"Apple Distribution\";/g" "$PBXPROJ"

          perl -0pi -e 's/(CA0B1C2D3E4F567801234567 \/\* Debug \*\/ = \{.*?buildSettings = \{)/${1}\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$ENV{APP_PROFILE_NAME}";/s' "$PBXPROJ"
          perl -0pi -e 's/(DA0B1C2D3E4F567801234567 \/\* Release \*\/ = \{.*?buildSettings = \{)/${1}\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$ENV{APP_PROFILE_NAME}";/s' "$PBXPROJ"
          perl -0pi -e 's/(E4F5A6B7C8D9E0F112345678 \/\* Debug \*\/ = \{.*?buildSettings = \{)/${1}\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$ENV{WIDGET_PROFILE_NAME}";/s' "$PBXPROJ"
          perl -0pi -e 's/(F5A6B7C8D9E0F11212345678 \/\* Release \*\/ = \{.*?buildSettings = \{)/${1}\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = "$ENV{WIDGET_PROFILE_NAME}";/s' "$PBXPROJ"

          grep -n "DEVELOPMENT_TEAM\\|CODE_SIGN_STYLE\\|PROVISIONING_PROFILE_SPECIFIER\\|CODE_SIGN_IDENTITY" "$PBXPROJ" | head -120

      - name: Generate ExportOptions.plist
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>$APP_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.kou888.myharness</key>
              <string>$APP_PROFILE_NAME</string>
              <key>com.kou888.myharness.widget</key>
              <string>$WIDGET_PROFILE_NAME</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive
        run: |
          set -euo pipefail
          xcodebuild \
            -project MyHarness.xcodeproj \
            -scheme MyHarness \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MyHarness.xcarchive" \
            CURRENT_PROJECT_VERSION="$TESTFLIGHT_BUILD_NUMBER" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            archive

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/MyHarness.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_P8_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Cleanup keychain and temp files
        if: always()
        run: |
          USER_HOME="$(dscl . -read /Users/$(whoami) NFSHomeDirectory | awk '{print $2}')"
          if [ -n "${ORIG_KEYCHAINS_FILE:-}" ] && [ -f "$ORIG_KEYCHAINS_FILE" ]; then
            security list-keychains -d user -s $(cat "$ORIG_KEYCHAINS_FILE") || true
          fi
          if [ -n "${ORIG_DEFAULT_KEYCHAIN:-}" ]; then
            security default-keychain -s "$ORIG_DEFAULT_KEYCHAIN" || true
          fi
          security delete-keychain "$RUNNER_TEMP/my-harness-signing.keychain-db" || true
          rm -f "$USER_HOME/Library/MobileDevice/Provisioning Profiles/${APP_PROFILE_UUID:-}.mobileprovision" || true
          rm -f "$USER_HOME/Library/MobileDevice/Provisioning Profiles/${WIDGET_PROFILE_UUID:-}.mobileprovision" || true
